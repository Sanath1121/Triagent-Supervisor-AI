version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: triagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dissertation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - triagent_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dissertation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: triagent_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - DISSERTATION_AUTH_ENABLED=false
      - DISSERTATION_API_KEY=
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - triagent_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  triagent_net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
